name: ci
on:
  pull_request:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: sbt/setup-sbt@v1
    - uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: temurin
    - uses: coursier/cache-action@v9
    - run: curl -Ls https://git.io/sbt > ./sbt && chmod 0755 ./sbt
    - run: ./sbt -v "+ Test/run"
